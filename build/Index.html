<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Smart Student Attendance Portal</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e3f2fd, #f5f7fa);
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 420px;
            background: white;
            padding: 35px;
            border-radius: 15px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.15);

            text-align: center;
        }

        .logo {
            width: 75px;
            height: 75px;

            margin: 0 auto 15px;

            background: #1565c0;
            color: white;

            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 28px;
            font-weight: bold;
        }

        h1 {
            margin: 5px 0;
            color: #1565c0;
            font-size: 25px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        select,
        input {
            width: 100%;
            padding: 13px;

            border: 1px solid #ccc;
            border-radius: 7px;

            font-size: 15px;
            outline: none;
        }

        select:focus,
        input:focus {
            border-color: #1565c0;
        }

        .login-button {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 7px;

            background: #1565c0;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;
        }

        .login-button:hover {
            background: #0d47a1;
        }

        .info {
            margin-top: 20px;
            padding: 12px;

            background: #f1f8ff;

            border-radius: 7px;

            font-size: 13px;
            color: #555;
        }

        .footer {
            margin-top: 20px;
            color: #888;
            font-size: 12px;
        }

    </style>

</head>


<body>


<div class="login-container">


    <div class="logo">
        SA
    </div>


    <h1>
        Smart Attendance Portal
    </h1>


    <div class="subtitle">
        Student Management and Attendance System
    </div>


    <!-- LOGIN FORM -->

    <form action="login.jsp" method="post">


        <!-- LOGIN TYPE -->

        <div class="form-group">

            <label for="role">
                Login As
            </label>

            <select
                id="role"
                name="role"
                required>

                <option value="">
                    -- Select Login Type --
                </option>

                <option value="STUDENT">
                    Student
                </option>

                <option value="FACULTY">
                    Faculty
                </option>

            </select>

        </div>


        <!-- USERNAME -->

        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter Username"
                required>

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter Password"
                required>

        </div>


        <!-- LOGIN BUTTON -->

        <button
            type="submit"
            class="login-button">

            Login

        </button>


    </form>


    <div class="info">

        <b>Student:</b>
        Username and password are your Student ID.

        <br><br>

        <b>Faculty:</b>
        Use your faculty ID and faculty password.

    </div>


    <div class="footer">

        Smart Student Management and Attendance Portal

    </div>


</div>


</body>

</html>
